<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>A Birthday Letter!</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Inter:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            /* A warm, celebratory gradient background for a birthday theme */
            background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 100%);
            overflow: hidden; /* Hide scrollbars caused by confetti */
            transition: background 0.5s ease-in-out; /* Add transition for background color change */
        }
        .font-cursive {
            font-family: 'Great Vibes', cursive;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-8px); }
            20%, 40%, 60%, 80% { transform: translateX(8px); }
        }
        .shake {
            animation: shake 0.5s ease-in-out;
        }
        .modal-leave {
            opacity: 0;
            transform: scale(0.9);
        }

        /* --- Birthday Confetti Animation --- */
        .confetti-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: 10;
            transition: opacity 0.5s ease-in-out;
        }
        .confetti {
            position: absolute;
            width: 10px;
            height: 10px;
            background-color: #f00;
            opacity: 0.7;
            animation: fall 15s linear infinite;
        }
        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg);
                opacity: 1;
            }
            100% {
                transform: translateY(110vh) rotate(720deg);
                opacity: 0;
            }
        }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen">

    <!-- Confetti Background -->
    <div id="confetti-container" class="confetti-container"></div>

    <!-- This container will hold the Google Drive PDF viewer -->
    <div id="pdf-container" class="absolute inset-0 hidden z-30">
        <iframe id="pdf-iframe" class="w-full h-full border-0" src="" title="PDF Document Viewer"></iframe>
    </div>
    
    <!-- The pop-up question modal -->
    <div id="modal" class="fixed inset-0 z-20 flex items-center justify-center bg-black/30 backdrop-blur-sm transition-all duration-300">
        <div id="modal-box" class="bg-white/90 rounded-xl shadow-2xl p-8 max-w-sm w-full text-center transform transition-all duration-300 scale-100">
            <h2 class="font-cursive text-5xl text-pink-500 mb-3 flex items-center justify-center gap-3">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-pink-400"><path d="M20 12v10H4V12"/><path d="M2 7h20v5H2z"/><path d="M12 22V7"/><path d="M12 7H7.5a2.5 2.5 0 0 1 0-5C11 2 12 7 12 7z"/><path d="M12 7h4.5a2.5 2.5 0 0 0 0-5C13 2 12 7 12 7z"/></svg>
                A Letter
            </h2>
            <p id="question" class="text-gray-600 mb-6">What is the date you went RU stadium for the first time with Pranto?</p>
            <form id="answer-form" novalidate>
                <input type="text" id="answer-input" class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-400 focus:border-transparent outline-none transition" placeholder="Your secret answer..." autocomplete="off">
                <p id="error-message" class="text-red-500 text-sm mt-2 h-5 transition-opacity duration-300 opacity-0"></p>
                <button type="submit" class="w-full bg-pink-500 text-white font-bold py-3 px-6 rounded-lg mt-4 hover:bg-pink-600 transition-all transform hover:scale-105 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-pink-500">Unlock Letter</button>
            </form>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            // --- CUSTOMIZE YOUR SETTINGS HERE ---
            const GOOGLE_DRIVE_EMBED_URL = 'https://drive.google.com/file/d/1fXubBUWpYKSnLpFb7ISzQsWZJJS4Krlx/preview';
            const CORRECT_ANSWER = '21';
            // --- END OF CUSTOMIZATION ---

            // --- Get all DOM elements ---
            const pdfContainer = document.getElementById('pdf-container');
            const pdfIframe = document.getElementById('pdf-iframe');
            const modal = document.getElementById('modal');
            const modalBox = document.getElementById('modal-box');
            const answerForm = document.getElementById('answer-form');
            const answerInput = document.getElementById('answer-input');
            const errorMessage = document.getElementById('error-message');
            const confettiContainer = document.getElementById('confetti-container');

            // --- Event Listener for the answer form ---
            answerForm.addEventListener('submit', (e) => {
                e.preventDefault();
                const userAnswer = answerInput.value.trim().toLowerCase();

                if (userAnswer === CORRECT_ANSWER.toLowerCase()) {
                    // Correct answer! Fade out the modal.
                    errorMessage.classList.remove('opacity-100');
                    modalBox.classList.remove('shake');
                    modal.classList.add('modal-leave');
                    
                    setTimeout(() => {
                        modal.classList.add('hidden');
                        
                        // Stop the confetti animation by completely removing its container
                        if (confettiContainer) {
                            confettiContainer.remove();
                        }
                        // Change body background to white for better PDF viewing
                        document.body.style.background = '#ffffff';

                        if (GOOGLE_DRIVE_EMBED_URL.includes('YOUR_FILE_ID_HERE')) {
                             pdfContainer.innerHTML = `<div class="p-10 text-center bg-white h-full flex flex-col justify-center items-center"><h2 class="font-cursive text-4xl text-red-600">Configuration Needed</h2><p class="text-gray-700 mt-2">Please edit the HTML file to add your Google Drive PDF link.</p></div>`;
                        } else {
                            pdfIframe.src = GOOGLE_DRIVE_EMBED_URL;
                        }
                        pdfContainer.classList.remove('hidden');

                    }, 300);

                } else {
                    // Incorrect answer. Show an error.
                    errorMessage.textContent = 'That\'s not the secret. Please try again.';
                    errorMessage.classList.add('opacity-100');
                    modalBox.classList.add('shake');
                    answerInput.focus();
                    answerInput.select();

                    setTimeout(() => {
                        modalBox.classList.remove('shake');
                    }, 500);
                }
            });

            // --- Confetti Generation Script ---
            const confettiCount = 50;
            const colors = ['#f687a2', '#f8b195', '#f6d365', '#a5dff9', '#c3aed6'];

            for (let i = 0; i < confettiCount; i++) {
                const confetti = document.createElement('div');
                confetti.classList.add('confetti');
                confetti.style.left = `${Math.random() * 100}vw`;
                confetti.style.animationDuration = `${Math.random() * 5 + 10}s`; // 10 to 15 seconds
                confetti.style.animationDelay = `${Math.random() * 10}s`;
                confetti.style.backgroundColor = colors[Math.floor(Math.random() * colors.length)];
                
                const size = `${Math.random() * 8 + 6}px`; // 6px to 14px
                confetti.style.width = size;
                confetti.style.height = size;

                if (confettiContainer) {
                   confettiContainer.appendChild(confetti);
                }
            }
        });
    </script>
</body>
</html>
