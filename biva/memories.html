<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Our Memories</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        /* Reusing the aesthetic styles */
        body {
            font-family: 'Poppins', sans-serif;
            overflow-x: hidden;
            cursor: default;
        }
        .font-great-vibes { font-family: 'Great Vibes', cursive; }
        .gradient-bg {
            background: linear-gradient(-45deg, #f8cdda, #d0b7fa, #bde0fe, #a2d2ff);
            background-size: 400% 400%;
            animation: gradient-animation 15s ease infinite;
        }
        @keyframes gradient-animation {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        .heart {
            position: absolute;
            width: 20px; height: 20px;
            background: rgba(255, 105, 180, 0.4);
            transform: rotate(45deg);
            animation: float 10s infinite;
            z-index: 0;
        }
        .heart::before, .heart::after {
            content: ''; position: absolute;
            width: 20px; height: 20px;
            background: rgba(255, 105, 180, 0.4);
            border-radius: 50%;
        }
        .heart::before { top: -10px; left: 0; }
        .heart::after { left: -10px; top: 0; }
        @keyframes float {
            0% { transform: translateY(0) rotate(45deg); opacity: 1; }
            100% { transform: translateY(-1500px) rotate(600deg); opacity: 0; }
        }
        .fade-in {
            opacity: 0;
            animation: fadeInAnimation 2s ease-in-out forwards;
        }
        @keyframes fadeInAnimation {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        /* For responsive YouTube embed */
        .video-container {
            position: relative;
            overflow: hidden;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
    </style>
</head>
<body class="gradient-bg">

    <div id="hearts-container" class="fixed top-0 left-0 w-full h-full overflow-hidden z-0"></div>

    <main class="relative z-10 flex items-center justify-center min-h-screen py-10 px-4">
        <div class="bg-white/50 backdrop-blur-xl p-6 md:p-10 rounded-2xl shadow-2xl text-center max-w-4xl w-full fade-in">
            
            <h1 class="font-great-vibes text-5xl md:text-7xl text-gray-800">Our Beautiful Journey</h1>
            
            <!-- Image Gallery Section -->
            <div class="mt-8">
                <h2 class="font-great-vibes text-3xl text-gray-700 mb-4">Oct 2, 2024 ------------ Aug 7, 2025 ------------ Oct 9, 2025</h2>
                <div class="grid grid-cols-2 sm:grid-cols-3 gap-4">
                    <!-- How to add your images: -->
                    <!-- 1. Upload your images to a hosting service (like imgur.com). -->
                    <!-- 2. Get the 'Direct Link' (ending in .jpg, .png, etc.). -->
                    <!-- 3. Replace the placeholder 'src' URL below with your direct link. -->

                    <!-- Image 1 -->
                    <div class="overflow-hidden rounded-lg shadow-lg transform hover:scale-105 transition-transform duration-300">
                        <img src="1.png" alt="Oct 2, 2024" class="w-full h-full object-cover">
                    </div>
                    <!-- Image 2 -->
                    <div class="overflow-hidden rounded-lg shadow-lg transform hover:scale-105 transition-transform duration-300">
                        <img src="2.png" alt="Aug 7, 2025" class="w-full h-full object-cover">
                    </div>
                    <!-- Image 3 -->
                    <div class="overflow-hidden rounded-lg shadow-lg transform hover:scale-105 transition-transform duration-300">
                         <img src="3.png" alt="Oct 9, 2025" class="w-full h-full object-cover">
                    </div>
                </div>
            </div>

            <!-- YouTube Video Section -->
            <div class="mt-12">
                <h2 class="font-great-vibes text-4xl text-gray-700 mb-4">A Special Video For You</h2>
                <div class="video-container rounded-lg shadow-lg overflow-hidden">
                    <!-- How to add your video: -->
                    <!-- 1. Upload your video to YouTube (you can make it 'Unlisted'). -->
                    <!-- 2. Click 'Share', then 'Embed'. -->
                    <!-- 3. Copy ONLY the URL from the 'src' attribute. -->
                    <!-- 4. Replace the placeholder URL below with your video's URL. -->
                    <iframe src="https://www.youtube.com/embed/dQw4w9WgXcQ" title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
                </div>
            </div>
            
            <!-- Back Button -->
            <div class="mt-12">
                 <a href="letter.html" class="inline-block bg-white text-pink-400 font-bold py-2 px-6 rounded-full shadow-lg transform hover:scale-105 transition-transform duration-300">
                    &larr; Letter to my sweetheart
                </a>
            </div>

        </div>
    </main>

    <script>
        // Script to create floating hearts
        document.addEventListener('DOMContentLoaded', () => {
            const heartsContainer = document.getElementById('hearts-container');
            function createHeart() {
                const heart = document.createElement('div');
                heart.classList.add('heart');
                heart.style.left = Math.random() * 100 + 'vw';
                heart.style.animationDuration = Math.random() * 5 + 5 + 's';
                heartsContainer.appendChild(heart);
                setTimeout(() => { heart.remove(); }, 10000);
            }
            setInterval(createHeart, 300);
        });
    </script>
</body>
</html>
